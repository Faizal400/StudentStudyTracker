{% extends "base.html" %}
{% block content %}
<div class="card shadow-sm p-4">
  <h2 class="mb-3">Login</h2>
  <form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Login</button>
  </form>
  <p class="text-info">No account? <a class="text-primary" href="{% url 'register' %}">Register here</a></p>
</div>
{% endblock %}
